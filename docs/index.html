<style>
:root{font-family:Inter,'Noto Sans JP',system-ui,sans-serif;color:#16243d;background:#f3f6fb;font-size:16px;font-synthesis:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea,summary{touch-action:manipulation}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:1px solid #ccd6e7;background:white;color:#25364e;border-radius:12px;padding:12px 16px;min-height:48px;font-weight:700;line-height:1.4}button:hover{background:#edf2ff}button:disabled{opacity:.55;cursor:wait}.primary{background:#3059df;color:white;border-color:#3059df}.primary:hover{background:#2446b3}a{color:#264fc9;text-underline-offset:4px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #789cff;outline-offset:3px}input:focus,select:focus,textarea:focus{outline:3px solid #d8e3ff;border-color:#3059df}header{background:#16243d;color:white;padding:20px max(20px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:18px;font-weight:850;letter-spacing:0;white-space:nowrap}.brand small{display:block;color:#b8c6dc;font-size:12px;margin-top:6px;letter-spacing:0}#account{display:flex;align-items:center;gap:10px;min-width:0;font-size:14px}#account .account-name{max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#logout{min-height:44px;padding:8px 12px;background:transparent;color:white;border-color:#52617a;font-size:14px}main{max-width:1200px;margin:auto;padding:28px 20px}.top,.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}h1{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}h2{font-size:20px;margin:0}p{line-height:1.7}.muted{color:#52647f;font-size:14px}.card{background:white;border:1px solid #dce3ed;border-radius:18px;padding:24px}.date{font-size:14px;font-weight:750;letter-spacing:.04em;color:#3059df}.event-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}.event-tile{display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 3px 12px #17233704}.event-tile h2{font-size:21px;line-height:1.5;overflow-wrap:anywhere}.event-tile p{margin:0}.event-tile .date{font-size:16px}.event-tile dl{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;margin:2px 0 0;background:#f3f6fb;border-radius:12px;padding:14px}.event-tile dt{font-size:14px;color:#52647f;line-height:1.6}.event-tile dt:nth-of-type(1){grid-column:1;grid-row:1}.event-tile dt:nth-of-type(2){grid-column:2;grid-row:1}.event-tile dd{margin:5px 0 0;font-size:18px;font-weight:750;overflow-wrap:anywhere;grid-row:2}.event-tile dd:nth-of-type(1){grid-column:1}.event-tile dd:nth-of-type(2){grid-column:2}.event-tile a,.detail-page .card>a,.detail-page .card>p>a{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #d3ddf0;border-radius:12px;padding:10px 12px;line-height:1.5;text-decoration:none;background:#f6f8ff;overflow-wrap:anywhere;font-size:15px;font-weight:650}.event-tile button{width:100%;margin-top:auto;background:#16243d;border-color:#16243d;color:white}.event-tile.today{border-top:4px solid #3059df}.event-tile.deadline{border-top:4px solid #d78a18}.badge{font-size:14px;border-radius:7px;display:inline-block;padding:5px 9px;background:#edf1f6;color:#43516b;line-height:1.4}.badge.available{background:#e2f5eb;color:#15633f}.badge.pending{background:#fff0d2;color:#825100}.badge.done{background:#e9eefe;color:#3f53a1}.event-tile .badge{align-self:flex-start}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}.stat{background:#f2f5fa;border-radius:12px;padding:14px}.stat b{font-size:28px;display:block}.stat span{font-size:14px;color:#52647f}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{font-size:14px;padding:10px 12px;min-height:44px}.chip.active{background:#172337;color:white;border-color:#172337}.ticket{border-top:1px solid #e4e9f0;padding:18px 0;display:grid;grid-template-columns:minmax(70px,.7fr) minmax(0,1.5fr) auto;align-items:center;gap:12px}.num{font-weight:850;font-size:23px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.ticket-body{min-width:0}.ticket-body p{margin:5px 0;overflow-wrap:anywhere}.ticket button{font-size:14px;padding:10px 12px;min-height:48px}.empty{text-align:center;padding:44px 15px;color:#52647f}.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.person{background:#f2f5fa;border-radius:8px;font-size:14px;padding:10px 12px;overflow-wrap:anywhere}.section{margin-top:22px}.note{white-space:pre-wrap;overflow-wrap:anywhere}.login{max-width:440px;margin:6vh auto}label{display:block;font-size:14px;font-weight:700;margin:18px 0 8px;line-height:1.6}input,select,textarea{width:100%;min-width:0;min-height:50px;border:1px solid #bdcbe0;border-radius:11px;padding:12px;background:white;color:#172337;font-size:16px;line-height:1.5}textarea{min-height:120px;resize:vertical}input[type=date]{appearance:none;-webkit-appearance:none}dialog{border:0;border-radius:22px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:0 25px 100px #17233744;overflow:auto;overscroll-behavior:contain}dialog::backdrop{background:#101d37a8}body:has(dialog[open]){overflow:hidden}dialog .modal-head{position:sticky;top:0;background:white;padding:22px 24px 16px;z-index:2;border-bottom:1px solid #e5eaf3}dialog .modal-body{padding:0 24px 20px}dialog .modal-actions{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 2fr;gap:12px;padding:14px 24px max(14px,env(safe-area-inset-bottom));background:white;border-top:1px solid #e5eaf3;z-index:2}.modal-context{margin:7px 0 0;font-size:14px;color:#52647f;overflow-wrap:anywhere}.form-message{color:#9b2530;background:#fff0f1;border-radius:9px;padding:10px 12px;margin:0 24px 12px;font-size:14px;line-height:1.6}.form-message:empty{display:none}.preview-count{font-size:14px;color:#3059df;background:#eef3ff;padding:10px 12px;border-radius:9px}.danger{color:#a62435}#notice{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;background:#172337;color:white;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 5px 30px #17233720;max-width:calc(100vw - 32px);width:max-content;pointer-events:none}#notice:empty{display:none}body:has(.mobile-action) #notice{bottom:100px}.actions{display:flex;gap:8px}.foot{margin-top:20px;font-size:12px;color:#52647f}.search{margin:8px 0 0;background:white}.detail-page{max-width:850px;margin:18px auto}.back{margin-top:20px}summary{cursor:pointer;min-height:44px;padding:12px 0;font-size:14px;font-weight:700;line-height:1.6}.members-panel{margin-top:14px;border-top:1px solid #e5eaf3}.mobile-action{display:none}.form-hint{margin:6px 0 0}.required{color:#a62435;font-size:12px;margin-left:6px}
@media(max-width:1000px){.event-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){header{padding:14px 16px;flex-wrap:wrap}.brand{font-size:16px}.brand small{font-size:11px}#account{gap:6px}#account .account-name{max-width:80px}#logout{padding:8px}main{padding:22px 16px max(24px,env(safe-area-inset-bottom))}.top .date{display:none}h1{font-size:25px;margin:0}.top .actions{width:100%}.actions #reload{flex:1}.actions #new-live{flex:2}.event-grid{grid-template-columns:1fr;gap:14px;margin-top:16px}.event-tile{padding:18px;gap:10px}.event-tile h2{font-size:20px}.event-tile dl{padding:12px}.card{padding:18px}.stat{padding:12px 8px;text-align:center}.stat b{font-size:25px}.stat span{font-size:13px}.ticket{gap:10px;grid-template-columns:minmax(66px,.8fr) minmax(0,1.6fr) auto}.num{font-size:21px}.ticket button{padding:10px}.chips{flex-wrap:nowrap;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}.chip{flex:0 0 auto}.detail-page{margin:16px 0}.detail-page .section>.row{align-items:center}.detail-page #add{display:none}.mobile-action{display:block;position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:#ffffffed;border-top:1px solid #dce3ed;backdrop-filter:blur(12px)}.mobile-action button{width:100%}body:has(.mobile-action) main{padding-bottom:110px}.person{width:100%}dialog{width:100%;max-width:100%;margin:auto 0 0;max-height:94dvh;border-radius:22px 22px 0 0}dialog .modal-head{padding:20px 20px 14px}dialog .modal-body{padding:0 20px 16px}dialog .modal-actions{padding-left:20px;padding-right:20px}.form-message{margin-left:20px;margin-right:20px}.login{margin:28px auto}.login h1{font-size:25px}}
@media(prefers-reduced-motion:no-preference){button,a{transition:background .15s,border-color .15s}dialog[open]{animation:appear .16s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
.group-tags{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.group-tag{border:1px solid #d8dff6;background:#eef1ff;color:#344b95;padding:5px 9px;border-radius:8px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}.group-options{display:flex;flex-wrap:wrap;gap:8px}.group-choice{display:flex;align-items:center;gap:8px;border:1px solid #ccd6e7;border-radius:10px;padding:10px;margin:0;min-height:48px;cursor:pointer;max-width:100%;overflow-wrap:anywhere}.group-choice:has(input:checked){background:#edf2ff;border-color:#3059df;color:#2446b3}.group-choice input{width:20px;min-width:20px;height:20px;min-height:20px;margin:0;accent-color:#3059df}fieldset{border:0;margin:20px 0 0;padding:0}legend{font-size:14px;font-weight:700;margin-bottom:10px}#member-message{color:#9b2530}#member-message:empty{display:none}
</style></head><body><header><div class="brand">Ticket Management<small>みんなのライブ・チケット管理</small></div><div id="account"></div></header><div id="notice" role="status" aria-live="polite"></div><main id="app"></main><dialog id="modal" aria-labelledby="modal-title"></dialog>
<script src="./config.js?v=a5773ee9"></script>
<script src="./transport.js"></script>
<script>
let data=null,selected='',filter='すべて',busy=false,memberId='',searchQuery='',lastDay='',homeScroll=0,noticeTimer=null,modalDirty=false;
try{memberId=localStorage.getItem('live-pocket-member')||'';sessionStorage.removeItem('live-pocket-key')}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['未発券','自分用','余り','取引中','捌けた'];
const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const field=(label,name,value='',type='text',required=false)=>`<label for="f-${name}">${label}${required?'<span class="required">必須</span>':''}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}>`;
const liveRequirements=l=>`<span style="display:block;margin-top:8px;line-height:1.7" class="muted">抽選締切：${esc(l.lotteryDeadline||'未設定')}<br>必要投げ数（1人あたり）：${l.requiredThrows!==''&&l.requiredThrows!=null?esc(l.requiredThrows)+'枚':'未設定'}</span>`;
const groupTags=l=>(l.groups||[]).length?`<div class="group-tags" aria-label="出演グループ">${l.groups.map(g=>`<span class="group-tag">${esc(g)}</span>`).join('')}</div>`:'';
const badge=s=>`<span class="badge ${s==='余り'?'available':s==='取引中'?'pending':s==='捌けた'?'done':''}">${esc(s)}</span>`;
function notice(s){clearTimeout(noticeTimer);$('notice').textContent=s;const inline=$('form-message');if(inline)inline.textContent=s; if(s==='保存しました'){noticeTimer=setTimeout(()=>{$('notice').textContent=''},3000)}}
function rpc(fn,...args){return window.LivePocketTransport.call(fn,...args)}
async function refresh(){if(busy||$('modal').open)return;busy=true;notice('読み込み中…');let error='';try{data=await rpc('getData',memberId);notice('');render()}catch(e){error=e.message}finally{busy=false}if(error){if(!data){rememberMember('');await chooseMemberScreen()}notice(error)}}
async function save(action,p){if(busy)return;busy=true;const controls=[...document.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled);controls.forEach(el=>el.disabled=true);notice('保存中…');try{data=await rpc('saveData',memberId,action,p);modalDirty=false;$('modal').close();render();notice('保存しました')}catch(e){if(action==='attendance')detail();notice(e.message)}finally{busy=false;controls.forEach(el=>el.disabled=false)}}
function rememberMember(id){memberId=id;try{if(id)localStorage.setItem('live-pocket-member',id);else localStorage.removeItem('live-pocket-member')}catch(e){}}
function memberMessage(message){const el=$('member-message');if(el)el.textContent=message;else notice(message)}
async function chooseMemberScreen(){
  data=null;selected='';searchQuery='';$('account').textContent='';
  $('app').innerHTML=`<div class="card login"><span class="date">Ticket Management</span><h1 style="margin-top:12px">名前を選んで始める</h1><p class="muted">自分の名前で参戦予定やチケットを登録できます。</p><p id="member-message" class="muted" role="status" aria-live="polite">名前を読み込み中…</p><div id="member-options"></div></div>`;
  try {
    const members=await rpc('getMembers');
    $('member-options').innerHTML=`${members.length?`<form id="member-select"><label for="member-id">あなたの名前</label><select id="member-id" name="member" required><option value="">名前を選択してください</option>${members.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select><button class="primary" style="width:100%;margin-top:16px">この名前で始める</button></form>`:'<p class="muted">まだ名前が登録されていません。最初のメンバーを登録してください。</p>'}<details ${members.length?'':'open'} style="margin-top:20px"><summary>＋ 自分の名前を追加</summary><form id="member-add"><label for="member-name">表示する名前</label><input id="member-name" name="name" maxlength="40" autocomplete="nickname" placeholder="例：たいち" required><button class="primary" style="width:100%;margin-top:16px">名前を登録して始める</button></form></details>`;
    memberMessage('');
    if($('member-select'))$('member-select').onsubmit=async e=>{e.preventDefault();if(busy)return;rememberMember(new FormData(e.target).get('member'));await refresh()};
    $('member-add').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const controls=[...$('app').querySelectorAll('button,input,select')];controls.forEach(x=>x.disabled=true);memberMessage('名前を登録中…');try{const m=await rpc('registerMember',$('member-name').value);rememberMember(m.id);busy=false;await refresh()}catch(err){memberMessage(err.message)}finally{busy=false;controls.forEach(x=>x.disabled=false)}};
  } catch(e){memberMessage(e.message);$('member-options').innerHTML='<button id="retry-members">もう一度読み込む</button>';$('retry-members').onclick=chooseMemberScreen}
}

function japanDay(now=new Date()){return now.toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'})}
function nextDay(day){return new Date(Date.parse(day+'T00:00:00Z')+86400000).toISOString().slice(0,10)}
function eventRank(l,today){if(l.date===today)return 0;if(l.lotteryDeadline===today)return 1;if(l.lotteryDeadline===nextDay(today))return 2;return 3}
function sortedEvents(lives,today){return [...lives].sort((a,b)=>eventRank(a,today)-eventRank(b,today)||a.date.localeCompare(b.date)||a.title.localeCompare(b.title,'ja')||a.id.localeCompare(b.id))}
function safeLink(url,label,sheet=false){const valid=sheet?/^https:\/\/docs\.google\.com\/spreadsheets\/d\/[a-zA-Z0-9_-]+(?:[/?#].*)?$/.test(url||''):/^https?:\/\/[a-zA-Z0-9.-]+(?::[0-9]+)?(?:[/?#][^\s<>]*)?$/.test(url||'');return valid?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:`<p class="muted">${label}：未設定</p>`}
function eventTile(l,tickets,today){const after=Boolean(l.lotteryDeadline)&&today>l.lotteryDeadline;const rank=eventRank(l,today);const labels=['本日開催','本日抽選締切','明日抽選締切'];const extra=after?`<dl><dt>全体あまり数</dt><dd>${tickets.filter(t=>t.liveId===l.id&&t.status==='余り').length}枚</dd></dl>${safeLink(l.sheetUrl,'関連スプシURL',true)}`:`<dl><dt>抽選締切</dt><dd>${esc(l.lotteryDeadline||'未設定')}</dd><dt>必要投げ数（1人あたり）</dt><dd>${l.requiredThrows!==''&&l.requiredThrows!=null?esc(l.requiredThrows)+'枚':'未設定'}</dd></dl>${safeLink(l.purchaseUrl,'チケットURL')}`;return `<article class="card event-tile ${rank===0?'today':rank<3?'deadline':''}" data-event="${esc(l.id)}">${rank<3?`<span class="badge ${rank===0?'done':'pending'}">${labels[rank]}</span>`:''}<span class="date">${esc(l.date.replaceAll('-','.'))}</span><h2>${esc(l.title)}</h2>${groupTags(l)}<p class="muted">${esc(l.venue||'会場未登録')}</p>${extra}<button data-live="${esc(l.id)}">詳細・自分の番号を登録</button></article>`}
function render(){if(!data)return;const today=japanDay();lastDay=today;const lives=sortedEvents(data.lives,today);if(selected&&!lives.some(x=>x.id===selected))selected='';
$('account').innerHTML=`<span class="account-name">${esc(data.me.name)}</span><button id="logout">名前を変更</button>`;$('logout').onclick=()=>{if(busy)return;rememberMember('');notice('');chooseMemberScreen()};
$('app').innerHTML=`<div class="top"><div><span class="date">YOUR LIVE BOARD</span><h1 style="margin-top:6px">${selected?'イベント詳細':'イベント一覧'}</h1></div><div class="actions"><button id="reload">再読込</button><button class="primary" id="new-live">＋ イベント登録</button></div></div>${selected?'<button class="back" id="back">← イベント一覧に戻る</button><section id="detail" class="detail-page"></section>':`<label for="search">イベントを探す</label><input id="search" class="search" placeholder="イベント名・会場・グループ" value="${esc(searchQuery)}"><div class="event-grid" id="lives"></div><p id="empty-events" class="empty" hidden></p>`}<p class="foot">最終読込 ${new Date(data.updatedAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})}（日本時間） · 60秒ごとに更新</p>`;
$('reload').onclick=refresh;$('new-live').onclick=()=>liveForm();if(selected){$('back').onclick=()=>{selected='';render();window.scrollTo(0,homeScroll)};detail()}else{drawTiles(lives,today);$('search').oninput=e=>{searchQuery=e.target.value;drawTiles(lives,today)}}}
function drawTiles(lives,today){const q=searchQuery.toLowerCase();const visible=lives.filter(l=>(l.title+' '+l.venue+' '+(l.groups||[]).join(' ')).toLowerCase().includes(q));$('lives').innerHTML=visible.map(l=>eventTile(l,data.tickets,today)).join('');$('empty-events').hidden=visible.length>0;$('empty-events').textContent=lives.length?'該当するイベントはありません。':'「＋ イベント登録」からイベントを登録してください。';document.querySelectorAll('[data-live]').forEach(b=>b.onclick=()=>{homeScroll=window.scrollY;selected=b.dataset.live;filter='すべて';render();window.scrollTo(0,0)})}

function detail(){const l=data.lives.find(l=>l.id===selected);if(!l){$('detail').innerHTML='<div class="card empty">まだイベントがありません。<br>「＋ イベント登録」から始めましょう。</div>';return}const tickets=data.tickets.filter(t=>t.liveId===l.id);const a=data.attendance.filter(a=>a.liveId===l.id);const mine=a.find(a=>a.memberId===data.me.id);const name=id=>data.members.find(m=>m.id===id)?.name||'退会メンバー';
$('detail').innerHTML=`<div class="card"><div class="row"><span class="date">${esc(l.date)}</span>${l.owner===data.me.id?'<button id="edit-live">イベント編集</button>':''}</div><h2 style="font-size:24px;margin-top:12px">${esc(l.title)}</h2>${groupTags(l)}<p class="muted">${esc(l.venue||'会場未登録')}</p>${liveRequirements(l)}${/^https?:\/\/[a-zA-Z0-9.-]+(?::[0-9]+)?(?:[/?#][^\s<>]*)?$/.test(l.purchaseUrl||'')?`<p><a href="${esc(l.purchaseUrl)}" target="_blank" rel="noopener noreferrer">チケット購入ページを開く ↗</a></p>`:''}${/^https:\/\/docs\.google\.com\/spreadsheets\/d\//.test(l.sheetUrl)?`<a href="${esc(l.sheetUrl)}" target="_blank" rel="noopener">関連スプレッドシートを開く ↗</a>`:''}${l.memo?`<p class="note muted">${esc(l.memo)}</p>`:''}<div class="stats"><div class="stat"><b>${a.filter(x=>x.status==='参戦').length}<small style="font-size:14px"> 人</small></b><span>参戦予定</span></div><div class="stat"><b>${tickets.filter(t=>t.status==='余り').length}<small style="font-size:14px"> 枚</small></b><span>余りチケット</span></div><div class="stat"><b>${tickets.filter(t=>t.status==='捌けた').length}<small style="font-size:14px"> 枚</small></b><span>捌けた</span></div></div><label for="attendance">あなたの参戦予定</label><select id="attendance"><option value="">未回答</option>${opts(['参戦','未定','不参加'],mine?.status)}</select><details class="members-panel"><summary>みんなの参戦予定・余り枚数（${data.members.length}人）</summary><div class="people">${data.members.map(m=>`<span class="person">${esc(m.name)} · ${esc(a.find(x=>x.memberId===m.id)?.status||'未回答')} · 余り${tickets.filter(t=>t.memberId===m.id&&t.status==='余り').length}枚</span>`).join('')}</div></details></div><div class="card section"><div class="row"><h2>チケット <span class="muted">${tickets.length}枚</span></h2><button class="primary" id="add">＋ 自分の番号を登録</button></div><div class="chips">${['すべて','余り','取引中','捌けた','自分用','未発券','自分のチケット'].map(s=>`<button class="chip ${s===filter?'active':''}" data-filter="${s}">${s}</button>`).join('')}</div><div id="tickets">${tickets.filter(t=>filter==='すべて'||(filter==='自分のチケット'?t.memberId===data.me.id:t.status===filter)).sort((a,b)=>a.number.localeCompare(b.number,'ja',{numeric:true})).map(t=>`<div class="ticket"><div class="num">${esc(t.number||'未発券')}</div><div class="ticket-body">${badge(t.status)}<p>${esc(name(t.memberId))}${t.recipient?` → ${esc(t.recipient)}`:''}</p>${t.memo?`<p class="muted">${esc(t.memo)}</p>`:''}</div>${t.memberId===data.me.id?`<button data-ticket="${esc(t.id)}">編集</button>`:''}</div>`).join('')||'<div class="empty">該当するチケットはありません。</div>'}</div></div><div class="mobile-action"><button class="primary" id="add-fixed">＋ 自分の番号を登録</button></div>`;
$('attendance').onchange=e=>{if(e.target.value)save('attendance',{liveId:l.id,status:e.target.value,version:mine?.version})};if($('edit-live'))$('edit-live').onclick=()=>liveForm(l);$('add').onclick=addForm;$('add-fixed').onclick=addForm;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;detail()});document.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>ticketForm(tickets.find(t=>t.id===b.dataset.ticket)))}
function closeModal(){if(busy)return;if(modalDirty&&!confirm('入力中の内容を破棄して閉じますか？'))return;modalDirty=false;$('modal').close()}
function modal(title,body,onSave){modalDirty=false;const live=/番号|チケット/.test(title)?data?.lives.find(l=>l.id===selected):null;$('modal').innerHTML=`<div class="modal-head"><h2 id="modal-title" tabindex="-1">${title}</h2>${live?`<p class="modal-context">${esc(live.title)}</p>`:''}</div><form id="form"><div class="modal-body">${body}</div><div id="form-message" class="form-message" role="alert"></div><div class="modal-actions"><button type="button" id="cancel">閉じる</button><button class="primary" id="submit-save">保存</button></div></form>`;$('cancel').onclick=closeModal;$('modal').oncancel=e=>{e.preventDefault();closeModal()};$('form').oninput=()=>modalDirty=true;$('form').onchange=()=>modalDirty=true;$('form').onsubmit=e=>{e.preventDefault();onSave(Object.fromEntries(new FormData(e.target)))};$('modal').showModal();$('modal').scrollTop=0;$('modal-title').focus()}

function liveForm(l={}){const available=[...new Set([...(data.groups||[]),...(l.groups||[])])].sort((a,b)=>a.localeCompare(b,'ja'));modal(l.id?'イベントを編集':'イベントを登録',field('日付','date',l.date,'date',true)+field('イベント名','title',l.title,'text',true)+field('会場','venue',l.venue)+field('チケット購入ページURL','purchaseUrl',l.purchaseUrl,'url')+field('抽選締切','lotteryDeadline',l.lotteryDeadline,'date')+`<label for="f-requiredThrows">必要投げ数（1人あたりの購入枚数）</label><input id="f-requiredThrows" name="requiredThrows" type="number" min="0" step="1" value="${esc(l.requiredThrows??'')}" placeholder="未設定"><fieldset><legend>出演グループ（複数選択）</legend><div class="group-options">${available.map(g=>`<label class="group-choice"><input type="checkbox" name="group-option" value="${esc(g)}" ${(l.groups||[]).includes(g)?'checked':''}>${esc(g)}</label>`).join('')||'<span class="muted">グループは下の欄から追加できます。</span>'}</div><label for="new-groups">新しいグループを追加</label><input id="new-groups" name="newGroups" placeholder="例：グループA、グループB"><p class="muted form-hint">カンマ・読点で区切って入力。イベントの保存時に追加されます。</p></fieldset><details style="margin-top:20px"><summary>関連スプシ・メモ（任意）</summary>`+field('関連スプシのURL','sheetUrl',l.sheetUrl,'url')+`<label for="memo">メモ</label><textarea id="memo" name="memo" maxlength="500">${esc(l.memo||'')}</textarea></details>`,p=>{const groups=[...document.querySelectorAll('#form input[name="group-option"]:checked')].map(el=>el.value).concat((p.newGroups||'').split(/[,、\n]+/).map(g=>g.trim()).filter(Boolean));save('live',{...p,groups,id:l.id,version:l.version})})}
function parseNumbers(value){return value.normalize('NFKC').trim().split(/[\s,、]+/).filter(Boolean)}
function addForm(){modal('自分の番号を登録',`<label for="status">登録時の状態</label><select id="status" name="status">${opts(['余り','自分用','未発券'],'余り')}</select><div id="number-fields"><label for="numbers">整理番号</label><textarea id="numbers" name="numbers" autocapitalize="characters" spellcheck="false" placeholder="A12\nA35\nA86" aria-describedby="number-hint number-preview"></textarea><p id="number-hint" class="muted form-hint">改行・カンマ・空白で区切って、50枚までまとめて入力できます。</p></div><div id="count-fields" hidden><label for="count">未発券の枚数</label><input id="count" name="count" type="number" inputmode="numeric" value="3" min="1" max="50" step="1" disabled></div><p id="number-preview" class="preview-count" aria-live="polite">0枚を登録</p><p class="muted form-hint">券種が異なる場合は「VIP-A12」などにしてください。</p>`,p=>{const numbers=p.status==='未発券'?Array(Number(p.count)).fill(''):parseNumbers(p.numbers);if(!numbers.length||numbers.length>50){notice('1〜50枚の整理番号を入力してください');return}const named=numbers.filter(Boolean).map(n=>n.toUpperCase());if(new Set(named).size!==named.length){notice('同じ整理番号が含まれています。入力を確認してください');return}save('addTickets',{liveId:selected,numbers,status:p.status})});const update=()=>{const pending=$('status').value==='未発券';$('number-fields').hidden=pending;$('count-fields').hidden=!pending;$('numbers').disabled=pending;$('count').disabled=!pending;$('count').required=pending;const count=pending?Number($('count').value):parseNumbers($('numbers').value).length;$('number-preview').textContent=count+'枚を登録';$('submit-save').textContent=count>0&&count<=50?count+'枚を登録':'登録する'};$('status').addEventListener('change',update);$('numbers').addEventListener('input',update);$('count').addEventListener('input',update);update()}

function ticketForm(t){modal('チケットを編集',field('整理番号','number',t.number)+`<label for="status">状態</label><select id="status" name="status">${opts(statuses,t.status)}</select>`+field('譲り先（任意）','recipient',t.recipient)+`<label for="memo">メモ</label><textarea id="memo" name="memo" maxlength="500">${esc(t.memo)}</textarea><button class="danger" type="button" id="delete" style="margin-top:18px">このチケットを削除</button>`,p=>save('ticket',{...p,id:t.id,liveId:t.liveId,version:t.version}));$('delete').onclick=()=>{if(confirm('このチケットを削除しますか？'))save('deleteTicket',{id:t.id,liveId:t.liveId,version:t.version})}}
function updateDay(){if(data&&!busy&&!$('modal').open&&document.visibilityState==='visible'&&lastDay!==japanDay())render()}
setInterval(updateDay,1000);document.addEventListener('visibilitychange',updateDay);
function showSetup(){ $('account').textContent='';$('app').innerHTML='<div class="card login"><span class="date">Ticket Management</span><h1 style="margin-top:12px">初期設定を準備中です</h1><p>イベント・チケットの保存先を接続すると利用できます。</p><p class="muted">幹事の方は設定手順に沿ってGASを公開し、そのURLを設定してください。メンバーの方の設定は不要です。</p><a href="https://github.com/M0CH4771/ticket-management#最初の設定" target="_blank" rel="noopener">設定手順を見る ↗</a></div>'}
if(!window.LIVE_POCKET_CONFIG?.gasUrl)showSetup();else if(memberId)refresh();else chooseMemberScreen();setInterval(()=>{if(data&&!busy&&!$('modal').open&&document.visibilityState==='visible'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))refresh()},60000);
</script></body></html>
