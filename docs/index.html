<script>
let data=null,selected='',filter='すべて',busy=false,memberId='',searchQuery='',lastDay='',homeScroll=0,noticeTimer=null,modalDirty=false;
let viewMode='list',cachedView=false,loading=false,refreshVersion=0;
try{viewMode=localStorage.getItem('ticket-view-mode')==='tiles'?'tiles':'list'}catch(e){}
try{memberId=localStorage.getItem('live-pocket-member')||'';sessionStorage.removeItem('live-pocket-key')}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['未発券','自分用','余り','取引中','捌けた'];
const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const field=(label,name,value='',type='text',required=false)=>`<label for="f-${name}">${label}${required?'<span class="required">必須</span>':''}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}>`;
const liveRequirements=l=>`<span style="display:block;margin-top:8px;line-height:1.7" class="muted">抽選締切：${esc(l.lotteryDeadline||'未設定')}<br>投げ数：${l.requiredThrows!==''&&l.requiredThrows!=null?esc(l.requiredThrows)+'枚':'未設定'}</span>`;
const groupTags=l=>(l.groups||[]).length?`<div class="group-tags" aria-label="出演グループ">${l.groups.map(g=>`<span class="group-tag">${esc(g)}</span>`).join('')}</div>`:'';
const badge=s=>`<span class="badge ${s==='余り'?'available':s==='取引中'?'pending':s==='捌けた'?'done':''}">${esc(s)}</span>`;
function notice(s){clearTimeout(noticeTimer);$('notice').textContent=s;const inline=$('form-message');if(inline)inline.textContent=s; if(s==='保存しました'){noticeTimer=setTimeout(()=>{$('notice').textContent=''},3000)}}
function rpc(fn,...args){return window.LivePocketTransport.call(fn,...args)}
function showRefreshState(){const button=$('reload');if(button){button.disabled=loading;button.textContent=loading?'更新中…':'再読込'}}
async function refresh(){
  if(busy||sending||loading||$('modal').open)return;
  const version=++refreshVersion,requestedMember=memberId;
  loading=true;showRefreshState();if(!data)notice('読み込み中…');
  try{
    const result=await rpc('getData',requestedMember);
    if(version!==refreshVersion||memberId!==requestedMember)return;
    confirmedData=result;rebuildOptimistic();cachedView=false;cacheSnapshot();notice('');
    // A background reply must never rebuild a form the user has started editing.
    if(!$('modal').open)render();
  }catch(e){
    if(version!==refreshVersion||memberId!==requestedMember)return;
    if(!data){rememberMember('');await chooseMemberScreen()}
    notice(e.message);
  }finally{if(version===refreshVersion){loading=false;showRefreshState()}}
}
function applySaveResult(current,result){
  if(result?.kind!=='patch-v1')return result; // Compatible with the existing GAS deployment.
  const next={...current,lastSavedAt:result.savedAt};
  const fields={Lives:'lives',Tickets:'tickets',Attendance:'attendance'};
  for(const [table,change] of Object.entries(result.changes)){
    const field=fields[table];if(!field)continue;
    const updates=new Map(change.upsert.map(row=>[row.id,row])),removed=new Set(change.remove);
    next[field]=current[field].filter(row=>!removed.has(row.id)).map(row=>{const update=updates.get(row.id);updates.delete(row.id);return update||row});
    next[field].push(...updates.values());
  }
  if(result.changes.Lives)next.groups=[...new Set(next.lives.flatMap(l=>l.groups||[]))].sort((a,b)=>a.localeCompare(b,'ja'));
  return next;
}
async function legacySave(action,p){if(busy)return;busy=true;++refreshVersion;loading=false;showRefreshState();const controls=[...document.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled);controls.forEach(el=>el.disabled=true);notice('保存中…');try{data=applySaveResult(data,await rpc('saveData',memberId,action,p,{response:'patch-v1'}));cacheSnapshot();modalDirty=false;$('modal').close();render();notice('保存しました')}catch(e){if(action==='attendance')detail();notice(e.message)}finally{busy=false;controls.forEach(el=>el.disabled=false)}}
let confirmedData=null,outbox=[],sending=false,recoveringOutbox=false,queueLease=null;
async function acquireQueueLease(){
  if(queueLease)return true;
  if(typeof navigator==='undefined'||!navigator.locks)return false;
  let ready;const result=new Promise(resolve=>ready=resolve);
  navigator.locks.request(outboxKey(),{ifAvailable:true},lock=>{
    if(!lock){ready(false);return}
    return new Promise(release=>{queueLease=()=>{queueLease=null;release()};ready(true)});
  }).catch(()=>ready(false));
  return result;
}
function releaseQueueLease(){if(queueLease)queueLease()}
function outboxKey(){return 'ticket-outbox:'+window.LIVE_POCKET_CONFIG.gasUrl+':'+memberId}
function persistOutbox(){
  if(outbox.length)localStorage.setItem(outboxKey(),JSON.stringify({base:confirmedData,items:outbox}));
  else localStorage.removeItem(outboxKey());
}
function restoreOutbox(){try{
  const saved=JSON.parse(localStorage.getItem(outboxKey())||'null');
  if(saved?.base?.me?.id!==memberId||!Array.isArray(saved.items)||!saved.items.length)return false;
  confirmedData=saved.base;outbox=saved.items.map(item=>({...item,state:item.state==='sending'?'queued':item.state}));
  cachedView=true;recoveringOutbox=true;rebuildOptimistic();return true;
}catch(e){return false}}
function operationKey(action,p){return action==='live'?'live:'+(p.id||'new'):action==='attendance'?'attendance:'+p.liveId:action==='addTickets'?'add:'+p.liveId:'ticket:'+p.id}
function optimisticPatch(base,item){
  const p=item.payload,id='pending-'+item.id,version=String(Number(p.version||0)+1);
  let table,row,remove=[];
  if(item.action==='live'){table='Lives';row={...p,id:p.id||id,owner:base.me.id,version,groups:p.groups||[]};}
  else if(item.action==='attendance'){table='Attendance';const old=base.attendance.find(a=>a.liveId===p.liveId&&a.memberId===base.me.id);row={id:old?.id||id,liveId:p.liveId,memberId:base.me.id,status:p.status,version};}
  else if(item.action==='addTickets')return {kind:'patch-v1',changes:{Tickets:{upsert:p.entries.map((e,i)=>({...e,id:id+'-'+i,liveId:p.liveId,memberId:base.me.id,recipient:'',memo:'',version:'1'})),remove:[]}}};
  else {table='Tickets';if(item.action==='deleteTicket')remove=[p.id];else row={...base.tickets.find(t=>t.id===p.id),...p,version};}
  return {kind:'patch-v1',changes:{[table]:{upsert:row?[row]:[],remove}}};
}
function rebuildOptimistic(){data=outbox.filter(item=>item.state!=='error').reduce((current,item)=>applySaveResult(current,optimisticPatch(current,item)),confirmedData)}
function pendingDescription(item){const p=item.payload;if(item.action==='live')return 'イベント：'+p.title;if(item.action==='attendance')return '参戦予定：'+p.status;if(item.action==='addTickets')return p.entries.map(e=>e.number+'（'+e.status+'）').join('、');return (p.number||'チケット')+(item.action==='deleteTicket'?'を削除':'：'+p.status)}
function syncPanel(){return outbox.length?`<section class="sync-panel" aria-label="保存状況"><strong>この端末の保存状況</strong>${outbox.map(item=>`<div class="sync-item"><span>${esc(pendingDescription(item))}</span><b>${item.state==='error'?'保存未確認':item.state==='sending'?'保存中…':'送信待ち'}</b>${item.error?`<p>${esc(item.error.replace('SAVE_UNCERTAIN: ',''))}</p>`:''}${item.state==='error'?`<div class="actions">${item.error?.includes('SAVE_UNCERTAIN')?'':`<button data-retry-save="${esc(item.id)}">再送</button>`}<button data-discard-save="${esc(item.id)}">保留を解除</button></div>`:''}</div>`).join('')}<p>「保存しました」と表示されるまでは、他の人への反映は未確認です。</p></section>`:''}
function bindSyncPanel(){
  document.querySelectorAll('[data-retry-save]').forEach(b=>b.onclick=()=>{const item=outbox.find(i=>i.id===b.dataset.retrySave);if(!item||sending)return;item.state='queued';item.error='';try{persistOutbox()}catch(e){notice('端末に保存できません。空き容量を確認してください');return}rebuildOptimistic();render();processOutbox()});

}
async function processOutbox(){
  if(sending||!outbox.length||outbox[0].state==='error')return;
  if(!await acquireQueueLease()){notice('別のタブで保存中です。そのタブで保存状況を確認してください。');return}
  if(sending||!outbox.length||outbox[0].state==='error')return;
  sending=true;const item=outbox[0],owner=memberId;
  ++refreshVersion;loading=false;item.state='sending';
  try{
    persistOutbox();if(!$('modal').open)render();
    const result=await rpc('saveData',owner,item.action,item.payload,{response:'patch-v1',requestId:item.id});
    confirmedData=applySaveResult(confirmedData,result);
    outbox.shift();
    try{persistOutbox()}catch(e){notice('保存は完了しましたが端末の保留情報を更新できません。再読込時に保存結果を再確認します。')}
    rebuildOptimistic();cacheSnapshot();if(!$('modal').open)render();notice('保存しました');
  }catch(e){item.state='error';item.error=e.message;try{persistOutbox()}catch(_){}rebuildOptimistic();if(!$('modal').open)render();notice('保存を確認できません。保存状況から再送・確認できます。');}
  finally{sending=false;}
  if(!outbox.length)releaseQueueLease();
  if(outbox.length&&outbox[0].state!=='error')processOutbox();
  else if(!outbox.length&&recoveringOutbox){recoveringOutbox=false;refresh()}
}
async function save(action,p){
  if(!data?.capabilities?.durableSave||typeof navigator==='undefined'||!navigator.locks)return legacySave(action,p);
  if(busy)return;
  if(String(p.id||p.liveId||'').startsWith('pending-')){notice('このイベント・チケットの保存完了後に変更できます');return}
  const key=operationKey(action,p);
  if(outbox.some(item=>item.key===key)){notice('同じ項目の変更が保留中です。保存状況を確認してください');return}
  if(outbox.length>=30){notice('保留中の保存が多いため、先に保存状況を確認してください');return}
  busy=true;const acquired=await acquireQueueLease();busy=false;
  if(!acquired){notice('別のタブで保存中です。そのタブの保存が終わってから再度保存してください');return}
  try{if(!outbox.length && localStorage.getItem(outboxKey())){
    if(restoreOutbox()){notice('以前の保存を先に確認します。入力はこの画面に残っています。');processOutbox();return}
  }}catch(e){releaseQueueLease();notice('端末への保管が利用できません。入力はこの画面に残っています。');return}
  if(!confirmedData)confirmedData=data;
  const item={id:crypto.randomUUID(),key,action,payload:JSON.parse(JSON.stringify(p)),state:'queued'};
  outbox.push(item);
  try{persistOutbox()}catch(e){outbox.pop();if(!outbox.length)releaseQueueLease();notice('端末に入力を保管できないため送信していません。入力はこの画面に残っています。');return}
  ++refreshVersion;loading=false;rebuildOptimistic();modalDirty=false;$('modal').close();render();notice('画面に反映しました。スプシへ保存中…');processOutbox();
}

function addForm(){
  if(busy)return;
  modal('自分の番号を登録',`<p class="muted">1枚ずつ番号と捌き状況を選び、まとめて登録できます。</p><div id="ticket-entry-rows"></div><button type="button" id="append-ticket" class="batch-add">＋ 1枚追加</button><details><summary>番号をまとめて貼り付ける</summary><label for="batch-numbers">整理番号</label><textarea id="batch-numbers" placeholder="A12\nA35\nA86"></textarea><p class="muted form-hint">改行・カンマ・空白で区切って入力。追加後に1枚ずつ状況を選べます。</p><button type="button" id="import-numbers">入力欄に追加</button></details><p id="number-preview" class="preview-count" aria-live="polite"></p><p class="muted form-hint">最大50枚。使わない入力欄は削除できます。</p>`,()=>{
    const entries=[...$('ticket-entry-rows').children].map(row=>({number:row.querySelector('input').value.normalize('NFKC').trim(),status:row.querySelector('select').value}));
    const named=entries.map(e=>e.number.toUpperCase()).filter(Boolean);
    if(new Set(named).size!==named.length){notice('同じ整理番号が含まれています。入力を確認してください');return}
    save('addTickets',{liveId:selected,entries});
  });
  let serial=0;
  const update=()=>{
    const rows=[...$('ticket-entry-rows').children];
    rows.forEach((row,i)=>{
      const input=row.querySelector('input');
      input.required=true;
      row.querySelector('.entry-label').textContent=(i+1)+'枚目';
      row.querySelector('button').disabled=rows.length===1;
    });
    $('append-ticket').disabled=rows.length>=50;
    $('number-preview').textContent=rows.length+'枚をまとめて登録';
    $('submit-save').textContent=rows.length+'枚を登録';
  };
  const append=(number='')=>{
    const id=++serial;
    $('ticket-entry-rows').insertAdjacentHTML('beforeend',`<div class="ticket-entry"><div class="entry-heading"><strong class="entry-label"></strong><button type="button" class="remove-entry" aria-label="この入力行を削除">削除</button></div><div class="entry-fields"><div><label for="entry-number-${id}">整理番号</label><input id="entry-number-${id}" value="${esc(number)}" maxlength="30" placeholder="例：A12" autocapitalize="characters" spellcheck="false" required></div><div><label for="entry-status-${id}">捌き状況</label><select id="entry-status-${id}">${opts(['余り','自分用','取引中','捌けた'],'余り')}</select></div></div></div>`);
    update();
  };
  $('ticket-entry-rows').onchange=update;
  $('ticket-entry-rows').onclick=e=>{if(e.target.closest('.remove-entry')){e.target.closest('.ticket-entry').remove();modalDirty=true;update()}};
  $('append-ticket').onclick=()=>{if($('ticket-entry-rows').children.length<50){append();modalDirty=true;$('ticket-entry-rows').lastElementChild.querySelector('input').focus()}};
  $('import-numbers').onclick=()=>{
    const numbers=parseNumbers($('batch-numbers').value);
    if(!numbers.length){notice('追加する番号を入力してください');return}
    const rows=[...$('ticket-entry-rows').children];
    const empty=rows.filter(row=>!row.querySelector('input').value.trim()&&row.querySelector('select').value==='余り');
    if(rows.length-empty.length+numbers.length>50){notice('1回に登録できるのは50枚までです');return}
    if(numbers.some(n=>n.length>30)){notice('整理番号は30文字以内にしてください');return}
    empty.forEach(row=>row.remove());
    numbers.forEach(append);$('batch-numbers').value='';modalDirty=true;update();
  };
  for(let i=0;i<3;i++)append();
}

function ticketForm(t){modal('チケットを編集',field('整理番号','number',t.number)+`<label for="status">状態</label><select id="status" name="status">${opts(statuses,t.status)}</select>`+field('譲り先（任意）','recipient',t.recipient)+`<label for="memo">メモ</label><textarea id="memo" name="memo" maxlength="500">${esc(t.memo)}</textarea><button class="danger" type="button" id="delete" style="margin-top:18px">このチケットを削除</button>`,p=>save('ticket',{...p,id:t.id,liveId:t.liveId,version:t.version}));$('delete').onclick=()=>{if(confirm('このチケットを削除しますか？'))save('deleteTicket',{id:t.id,liveId:t.liveId,version:t.version})}}

window.addEventListener('popstate',handleHistory);
if(history.state?.ticketView==='detail')selected=history.state.id;else history.replaceState({ticketView:'home'},'',location.href);
if(!window.LIVE_POCKET_CONFIG?.gasUrl)showSetup();else if(memberId){if(restoreOutbox()){render();processOutbox()}else{if(restoreSnapshot()){confirmedData=data;render()}refresh()}}else chooseMemberScreen();
</script></body></html>
