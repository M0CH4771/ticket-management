<script>
let data=null,selected='',filter='すべて',busy=false,memberId='',auth=null,searchQuery='',groupFilter='',lastDay='',homeScroll=0,noticeTimer=null,modalDirty=false,searchTimer=0;
let managerLiveId='',managerMode='',myFilter='すべて',applicationFilter='',archiveView=false,mobileFiltersOpen=false;
let viewMode='list',cachedView=false,loading=false,refreshVersion=0,calendarMonth='',calendarSelectedDate='';
try{const savedView=localStorage.getItem('ticket-view-mode');viewMode=savedView==='tiles'||savedView==='calendar'?'calendar':'list'}catch(e){}
try{memberId=localStorage.getItem('live-pocket-member')||'';sessionStorage.removeItem('live-pocket-key')}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['余り','自分用','捌けた'];
function ticketStatusOptions(current,requireSelection=false){return (current&&!statuses.includes(current)?`<option value="${requireSelection?'':esc(current)}" disabled selected>${esc(current)}（旧設定・変更してください）</option>`:'')+opts(statuses,current)}
const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const field=(label,name,value='',type='text',required=false,list='')=>`<label for="f-${name}">${label}${required?'<span class="required">必須</span>':''}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}${list?' list="'+esc(list)+'"':''}>`;
const eventSuggestionKey='ticket-management-event-suggestions-v1';
function readEventSuggestions(){try{const value=JSON.parse(localStorage.getItem(eventSuggestionKey)||'{}');return{titles:Array.isArray(value.titles)?value.titles.filter(x=>typeof x==='string'):[],venues:Array.isArray(value.venues)?value.venues.filter(x=>typeof x==='string'):[]}}catch(e){return{titles:[],venues:[]}}}
function liveFieldOptions(fieldName){const saved=readEventSuggestions(),recent=fieldName==='title'?saved.titles:saved.venues,shared=(data?.lives||[]).map(l=>l[fieldName]),seen=new Set(),result=[];for(const raw of [...recent,...shared]){const value=String(raw||'').trim(),key=value.normalize('NFKC').toLocaleLowerCase('ja');if(!value||seen.has(key))continue;seen.add(key);result.push(value)}return result}
function rememberEventInput(title,venue){const saved=readEventSuggestions();for(const [key,raw] of [['titles',title],['venues',venue]]){const value=String(raw||'').trim();if(!value)continue;const normalized=value.normalize('NFKC').toLocaleLowerCase('ja');saved[key]=[value,...saved[key].filter(x=>x.normalize('NFKC').toLocaleLowerCase('ja')!==normalized)].slice(0,40)}try{localStorage.setItem(eventSuggestionKey,JSON.stringify(saved))}catch(e){}}
function suggestionList(id,values){return`<datalist id="${esc(id)}">${values.map(value=>`<option value="${esc(value)}"></option>`).join('')}</datalist>`}
const groupTags=l=>(l.groups||[]).length?`<div class="group-tags" aria-label="出演グループ">${l.groups.map(g=>`<span class="group-tag">${esc(g)}</span>`).join('')}</div>`:'';
const badge=s=>`<span class="badge ${s==='余り'?'available':s==='取引中'?'pending':s==='捌けた'?'done':''}">${esc(s)}</span>`;
const startupStartedAt=performance.now();let startupCloseTimer=0;
function finishStartup(){
  const screen=$('startup-screen');
  if(!screen||screen.classList.contains('closing')||startupCloseTimer)return;
  const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const minimum=reduced?0:900; // shown once a day; lets the stub-tear finish
  const wait=Math.max(0,minimum-(performance.now()-startupStartedAt));
  startupCloseTimer=setTimeout(()=>{
    if(!screen.isConnected)return;
    screen.classList.add('closing');
    setTimeout(()=>screen.remove(),220);
  },wait);
}
function notice(s){clearTimeout(noticeTimer);$('notice').textContent=s;const inline=$('form-message');if(inline)inline.textContent=s; if(s==='保存しました'){noticeTimer=setTimeout(()=>{$('notice').textContent=''},3000)}}
function rpc(fn,...args){return window.LivePocketTransport.call(fn,...args)}
function showRefreshState(){const button=$('reload');if(button){button.disabled=loading;button.textContent=loading?'更新中…':'再読込'}}
const timetableImportParam=new URLSearchParams(location.search).get('timetableImport');
let pendingTimetableImport=null;
try{if(timetableImportParam){const payload=JSON.parse(timetableImportParam);if(payload?.version===1&&typeof payload.title==='string'&&typeof payload.date==='string'&&typeof payload.purchaseUrl==='string'&&typeof payload.sheetUrl==='string')pendingTimetableImport={title:payload.title.slice(0,150),date:payload.date.slice(0,10),venue:String(payload.venue||'').slice(0,150),purchaseUrl:payload.purchaseUrl.slice(0,2000),sheetUrl:payload.sheetUrl.slice(0,600),groups:[]};}}catch(e){}
function openPendingTimetableImport(){if(!pendingTimetableImport||!data||$('modal').open)return;const payload=pendingTimetableImport;pendingTimetableImport=null;const url=new URL(location.href);url.searchParams.delete('timetableImport');history.replaceState(null,'',url.pathname+url.search+url.hash);liveForm(payload);notice('タイムテーブルのイベント情報を入力しました。内容を確認して保存してください。')}
async function refresh(){
  if(busy||sending||loading||$('modal').open)return;
  const version=++refreshVersion,requestedMember=memberId;
  loading=true;showRefreshState();if(!data){$('app').innerHTML='<section class="card loading-state" role="status" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><h2>イベントを読み込んでいます</h2><p class="muted">スプレッドシートから最新情報を取得しています。</p></section>';notice('')}
  try{
    const result=await rpc('getData',requestedMember);
    if(version!==refreshVersion||memberId!==requestedMember)return;
    confirmedData=result;rebuildOptimistic();cachedView=false;cacheSnapshot();document.getElementById('load-error')?.remove();notice('');
    // A background reply must never rebuild a form the user has started editing.
    if(!$('modal').open){render();openPendingTimetableImport()}else refreshTicketManager();
  }catch(e){
    if(version!==refreshVersion||memberId!==requestedMember)return;
    if(/登録されたメンバーではありません|未登録です/.test(e.message||'')){rememberMember('');data=null;confirmedData=null;loading=false;chooseMemberScreen();return}
    if(!data){
      $('app').innerHTML='<div class="card login"><h1>読み込めませんでした</h1><p class="muted">通信状態を確認して、もう一度お試しください。</p><div id="member-options"><button id="reload" class="primary">再読込</button><button id="change-member">ログイン画面に戻る</button></div></div>';
      $('reload').onclick=refresh;$('change-member').onclick=chooseMemberScreen;
    }
    if(data){document.getElementById('load-error')?.remove();const host=$('sync-host');if(host){host.insertAdjacentHTML('afterend','<div id="load-error" class="load-error" role="alert"><span>'+esc(e.message||'読み込みに失敗しました')+'</span><button type="button" id="retry-load">再読み込み</button></div>');$('retry-load').onclick=()=>{document.getElementById('load-error')?.remove();refresh()}}notice(e.message)}else notice(e.message);finishStartup();
  }finally{if(version===refreshVersion){loading=false;showRefreshState()}}
}
function applySaveResult(current,result){
  if(result?.kind!=='patch-v1')return result; // Compatible with the existing GAS deployment.
  const next={...current,lastSavedAt:result.savedAt};
  const fields={Lives:'lives',Tickets:'tickets',Attendance:'attendance'};
  for(const [table,change] of Object.entries(result.changes)){
    const field=fields[table];if(!field)continue;
    const updates=new Map(change.upsert.map(row=>[row.id,row])),removed=new Set(change.remove);
    next[field]=current[field].filter(row=>!removed.has(row.id)).map(row=>{const update=updates.get(row.id);updates.delete(row.id);return update||row});
    next[field].push(...updates.values());
  }
  if(result.changes.Lives)next.groups=[...new Set(next.lives.flatMap(l=>l.groups||[]))].sort((a,b)=>a.localeCompare(b,'ja'));
  return next;
}
async function legacySave(action,p){if(busy)return;busy=true;++refreshVersion;loading=false;showRefreshState();const controls=[...document.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled);controls.forEach(el=>el.disabled=true);notice('保存中…');try{data=applySaveResult(data,await rpc('saveData',memberId,action,p,{response:'patch-v1'}));cacheSnapshot();modalDirty=false;$('modal').close();updateSaveView(action);notice('保存しました')}catch(e){if(action==='attendance')updateSaveView(action);notice(e.message)}finally{busy=false;controls.forEach(el=>el.disabled=false);if(managerLiveId&&!$('modal').open)ticketManager(managerLiveId)}}
let confirmedData=null,outbox=[],sending=false,recoveringOutbox=false,queueLease=null;
async function acquireQueueLease(){
  if(queueLease)return true;
  if(typeof navigator==='undefined'||!navigator.locks)return false;
  let ready;const result=new Promise(resolve=>ready=resolve);
  navigator.locks.request(outboxKey(),{ifAvailable:true},lock=>{
    if(!lock){ready(false);return}
    return new Promise(release=>{queueLease=()=>{queueLease=null;release()};ready(true)});
  }).catch(()=>ready(false));
  return result;
}
function releaseQueueLease(){if(queueLease)queueLease()}
function outboxKey(){return 'ticket-outbox:'+window.LIVE_POCKET_CONFIG.gasUrl+':'+memberId}
function persistOutbox(){
  if(outbox.length)localStorage.setItem(outboxKey(),JSON.stringify({base:confirmedData,items:outbox}));
  else localStorage.removeItem(outboxKey());
}
function restoreOutbox(){try{
  const saved=JSON.parse(localStorage.getItem(outboxKey())||'null');
  if(saved?.base?.me?.id!==memberId||!Array.isArray(saved.items)||!saved.items.length)return false;
  confirmedData=saved.base;outbox=saved.items.map(item=>({...item,state:item.state==='sending'?'queued':item.state}));
  cachedView=true;recoveringOutbox=true;rebuildOptimistic();return true;
}catch(e){return false}}
function operationKey(action,p){return ['live','deleteLive','archiveLive','restoreLive'].includes(action)?'live:'+(p.id||'new'):action==='attendance'?'attendance:'+p.liveId:action==='application'?'application:'+p.liveId:action==='addTickets'?'add:'+p.liveId:'ticket:'+p.id}
function optimisticPatch(base,item){
  const p=item.payload,id='pending-'+item.id,version=String(Number(p.version||0)+1);
  let table,row,remove=[];
  if(item.action==='deleteLive')return {kind:'patch-v1',changes:{Lives:{upsert:[],remove:[p.id]}}};
  if(item.action==='archiveLive'||item.action==='restoreLive'){table='Lives';row={...base.lives.find(l=>l.id===p.id),archived:item.action==='archiveLive',version};}
  else if(item.action==='live'){table='Lives';const existingLive=p.id&&base.lives.find(l=>l.id===p.id);row={...p,id:p.id||id,owner:existingLive?.owner||base.me.id,version,groups:p.groups||[]};}
  else if(item.action==='attendance'){table='Attendance';const old=base.attendance.find(a=>a.liveId===p.liveId&&a.memberId===base.me.id);const applied=p.status==='不参加'?'申込不要':old?.status==='不参加'?'':old?.applied||'';row={id:old?.id||id,liveId:p.liveId,memberId:base.me.id,status:p.status,applied,version};}
  else if(item.action==='application'){table='Attendance';const old=base.attendance.find(a=>a.liveId===p.liveId&&a.memberId===base.me.id);const applied=old?.status==='不参加'?'申込不要':p.applied==='未確認'?'':p.applied;row={id:old?.id||id,liveId:p.liveId,memberId:base.me.id,status:old?.status||'',applied,version};}
  else if(item.action==='addTickets')return {kind:'patch-v1',changes:{Tickets:{upsert:p.entries.map((e,i)=>({...e,id:id+'-'+i,liveId:p.liveId,memberId:base.me.id,recipient:'',memo:'',version:'1'})),remove:[]}}};
  else {table='Tickets';if(item.action==='deleteTicket')remove=[p.id];else row={...base.tickets.find(t=>t.id===p.id),...p,version};}
  return {kind:'patch-v1',changes:{[table]:{upsert:row?[row]:[],remove}}};
}
function rebuildOptimistic(){data=outbox.filter(item=>item.state!=='error').reduce((current,item)=>applySaveResult(current,optimisticPatch(current,item)),confirmedData)}
function pendingDescription(item){const p=item.payload;if(item.action==='live')return 'イベント：'+p.title;if(item.action==='deleteLive')return 'イベントを削除：'+(p.title||p.id);if(item.action==='archiveLive')return 'イベントをアーカイブ：'+(p.title||p.id);if(item.action==='restoreLive')return 'イベントを復元：'+(p.title||p.id);if(item.action==='attendance')return '参戦予定：'+p.status;if(item.action==='application')return '申込状況：'+p.applied;if(item.action==='addTickets')return p.entries.map(e=>e.number+'（'+e.status+'）').join('、');return (p.number||'チケット')+(item.action==='deleteTicket'?'を削除':'：'+p.status)}
function syncPanel(){return outbox.length?`<details class="sync-panel" aria-label="保存状況" ${outbox.some(i=>i.state==='error')?'open':''}><summary><span role="status">${outbox.some(i=>i.state==='error')?'保存未確認':'保存中…'} ${outbox.length}件</span></summary>${outbox.map(item=>`<div class="sync-item"><span>${esc(pendingDescription(item))}</span><b>${item.state==='error'?'保存未確認':item.state==='sending'?'保存中…':'送信待ち'}</b>${item.error?`<p>${esc(item.error.replace('SAVE_UNCERTAIN: ',''))}</p>`:''}${item.state==='error'?`<div class="actions">${item.error?.includes('SAVE_UNCERTAIN')?'':`<button data-retry-save="${esc(item.id)}">再送</button>`}<button data-discard-save="${esc(item.id)}">保留を解除</button></div>`:''}</div>`).join('')}<p>「保存しました」と表示されるまでは、他の人への反映は未確認です。</p></details>`:''}
function bindSyncPanel(){
  document.querySelectorAll('[data-retry-save]').forEach(b=>b.onclick=()=>{const item=outbox.find(i=>i.id===b.dataset.retrySave);if(!item||sending)return;item.state='queued';item.error='';try{persistOutbox()}catch(e){notice('端末に保存できません。空き容量を確認してください');return}rebuildOptimistic();render();processOutbox()});
  document.querySelectorAll('[data-discard-save]').forEach(b=>b.onclick=()=>{if(sending)return;if(!confirm('入力の保留を解除します。既にスプシに保存された変更は取り消されません。再読込で確認してください。'))return;outbox=outbox.filter(i=>i.id!==b.dataset.discardSave);try{persistOutbox()}catch(e){notice('保留の更新に失敗しました');return}rebuildOptimistic();render();if(outbox.length)processOutbox();else {releaseQueueLease();refresh()}});
}
async function processOutbox(){
  if(sending||!outbox.length||outbox[0].state==='error')return;
  if(!await acquireQueueLease()){notice('別のタブで保存中です。そのタブで保存状況を確認してください。');return}
  if(sending||!outbox.length||outbox[0].state==='error')return;
  sending=true;const item=outbox[0],owner=memberId;
  ++refreshVersion;loading=false;item.state='sending';
  try{
    persistOutbox();if(!$('modal').open)updateSaveView(item.action);
    const result=await rpc('saveData',owner,item.action,item.payload,{response:'patch-v1',requestId:item.id});
    confirmedData=applySaveResult(confirmedData,result);
    outbox.shift();
    try{persistOutbox()}catch(e){notice('保存は完了しましたが端末の保留情報を更新できません。再読込時に保存結果を再確認します。')}
    rebuildOptimistic();cacheSnapshot();if(!$('modal').open)updateSaveView(item.action);else refreshTicketManager();notice('保存しました');
  }catch(e){item.state='error';item.error=e.message;try{persistOutbox()}catch(_){}rebuildOptimistic();if(!$('modal').open)updateSaveView(item.action);else refreshTicketManager();notice('保存を確認できません。保存状況から再送・確認できます。');}
  finally{sending=false;}
  if(!outbox.length)releaseQueueLease();
  if(outbox.length&&outbox[0].state!=='error')processOutbox();
  else if(!outbox.length&&recoveringOutbox){recoveringOutbox=false;refresh()}
}
async function save(action,p){
  if(!data?.capabilities?.durableSave||typeof navigator==='undefined'||!navigator.locks)return legacySave(action,p);
  if(busy)return;
  if(String(p.id||p.liveId||'').startsWith('pending-')){notice('このイベント・チケットの保存完了後に変更できます');return}
  const key=operationKey(action,p);
  if(outbox.some(item=>item.key===key)){notice('同じ項目の変更が保留中です。保存状況を確認してください');return}
  if(outbox.length>=30){notice('保留中の保存が多いため、先に保存状況を確認してください');return}
  busy=true;const acquired=await acquireQueueLease();busy=false;
  if(!acquired){notice('別のタブで保存中です。そのタブの保存が終わってから再度保存してください');return}
  try{if(!outbox.length && localStorage.getItem(outboxKey())){
    if(restoreOutbox()){notice('以前の保存を先に確認します。入力はこの画面に残っています。');processOutbox();return}
  }}catch(e){releaseQueueLease();notice('端末への保管が利用できません。入力はこの画面に残っています。');return}
  if(!confirmedData)confirmedData=data;
  const item={id:crypto.randomUUID(),key,action,payload:JSON.parse(JSON.stringify(p)),state:'queued'};
  outbox.push(item);
  try{persistOutbox()}catch(e){outbox.pop();if(!outbox.length)releaseQueueLease();notice('端末に入力を保管できないため送信していません。入力はこの画面に残っています。');return}
  ++refreshVersion;loading=false;rebuildOptimistic();modalDirty=false;$('modal').close();updateSaveView(action);if(managerLiveId)ticketManager(managerLiveId);notice('画面に反映しました。スプシへ保存中…');processOutbox();
}

function rememberMember(id){if(id!==memberId){++refreshVersion;loading=false;try{localStorage.removeItem(snapshotKey);sessionStorage.removeItem('ticket-snapshot')}catch(e){}}memberId=id;try{if(id)localStorage.setItem('live-pocket-member',id);else localStorage.removeItem('live-pocket-member')}catch(e){}}
function memberMessage(message,isError=false){const el=$('member-message');if(el){el.textContent=message;el.classList.toggle('is-error',isError)}else notice(message)}
// Firebase web config is public and rarely changes, so it is cached per GAS endpoint.
// A cached copy lets sign-in start immediately instead of waiting for a GAS round trip.
let authInit=null;
function authConfigKey(){return 'ticket-auth-config:'+(window.LIVE_POCKET_CONFIG?.gasUrl||'')}
function initAuth(){
  if(authInit)return authInit;
  authInit=(async()=>{
    let config=null;try{config=JSON.parse(localStorage.getItem(authConfigKey())||'null')}catch(e){}
    const fetchConfig=async()=>{const fresh=await rpc('getAuthConfig');if(!fresh?.ready)throw new Error('Firebase Authenticationを設定してください。管理者はREADMEのログイン設定を確認してください');try{localStorage.setItem(authConfigKey(),JSON.stringify(fresh))}catch(e){}return fresh};
    if(!config?.ready)config=await fetchConfig();
    const module=await import('./auth.js');
    try{auth=await module.initialize(config.firebase)}

// Normal launch: show the last list immediately, then load the latest with one GAS call.
async function startApp(){

  const authReady=initAuth();
  if(memberId&&restoreSnapshot()){confirmedData=data;render()}
  let signedIn=false,authFailed=false;
  try{signedIn=Boolean((await authReady).currentUser())}catch(e){authFailed=true}
  // Offline or Google unreachable: keep the last list on screen and offer a retry.
  if(authFailed&&data){await refresh();finishStartup();return}
  if(!memberId||!signedIn){data=null;confirmedData=null;chooseMemberScreen();return}
  if(restoreOutbox()){if(!data&&restoreSnapshot()){confirmedData=data;render()}await processOutbox()}

  finishStartup();
  setTimeout(()=>import('./notifications.js').then(m=>m.resume()).catch(()=>{}),1000);
}

function renderCalendar(events,today,allLives){
  if(!calendarMonth)calendarMonth=today.slice(0,7);

  const p=calendarMonth.split('-').map(Number),year=p[0],month=p[1];

  const daysInMonth=new Date(Date.UTC(year,month,0)).getUTCDate();
  const cellCount=firstDay+daysInMonth>35?42:35;
  const startDate=new Date(Date.UTC(year,month-1,1-firstDay)),cells=[];
  for(let i=0;i<cellCount;i++){
    const d=new Date(startDate);d.setUTCDate(startDate.getUTCDate()+i);
    const day=d.toISOString().slice(0,10),inMonth=d.getUTCMonth()===month-1,entries=[];
    for(const live of events){
      if(live.date===day)entries.push({live,type:'live'});
      if(live.lotteryDeadline===day)entries.push({live,type:'deadline'});
    }
    const markers=entries.slice(0,3).map(e=>'<i class="calendar-marker '+e.type+'" aria-hidden="true"></i>').join('');
    const chips=entries.slice(0,3).map(e=>'<span class="calendar-chip '+e.type+'" title="'+esc(e.type==='deadline'?'抽選締切：':'開催：')+esc(e.live.title)+'"><b>'+(e.type==='deadline'?'締切':'開催')+'</b> '+esc(e.live.title)+'</span>').join('');
    cells.push('<button type="button" class="calendar-day '+(inMonth?'':'outside')+' '+(day===today?'today':'')+' '+(day===calendarSelectedDate?'selected':'')+'" data-cal-date="'+day+'" aria-label="'+calendarDateLabel(day)+'、'+entries.length+'件">'+
      '<span class="calendar-day-number">'+d.getUTCDate()+'</span><span class="calendar-markers">'+markers+(entries.length>3?'<small>+'+(entries.length-3)+'</small>':'')+'</span>'+
      '<span class="calendar-chips">'+chips+(entries.length>3?'<small>ほか'+(entries.length-3)+'件</small>':'')+'</span></button>');
  }
  const selected=events.filter(l=>l.date===calendarSelectedDate||l.lotteryDeadline===calendarSelectedDate).sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title,'ja'));
  const selectedCards=selected.map(l=>eventTile(l,data.tickets,today)).join('');
  const label=calendarMonthLabel(calendarMonth);
  $('lives').innerHTML='<section class="calendar-view" aria-label="イベントカレンダー">'+
    '<div class="calendar-toolbar"><button type="button" data-cal-prev aria-label="前の月">‹</button><h2>'+label+'</h2><button type="button" data-cal-next aria-label="次の月">›</button><button type="button" class="calendar-today" data-cal-today>今月</button></div>'+
    '<div class="calendar-legend" aria-hidden="true"><span><i></i>開催日</span><span><i class="deadline"></i>抽選締切</span></div>'+
    '<div class="calendar-grid" role="grid" aria-label="'+label+'">'+
    ['日','月','火','水','木','金','土'].map(day=>'<div class="calendar-weekday" role="columnheader">'+day+'</div>').join('')+cells.join('')+'</div>'+
    '<section class="calendar-agenda"><h2>'+calendarDateLabel(calendarSelectedDate)+'の予定</h2>'+
    (selectedCards?'<div class="calendar-day-events event-grid event-list">'+selectedCards+'</div>':'<p class="calendar-empty">この日のイベント・抽選締切はありません。</p>')+
    '</section></section>';
  $('lives').querySelector('[data-cal-prev]').onclick=()=>{calendarMonth=monthShift(calendarMonth,-1);calendarSelectedDate=calendarMonth+'-01';drawTiles(allLives,today)};
  $('lives').querySelector('[data-cal-next]').onclick=()=>{calendarMonth=monthShift(calendarMonth,1);calendarSelectedDate=calendarMonth+'-01';drawTiles(allLives,today)};
  $('lives').querySelector('[data-cal-today]').onclick=()=>{calendarMonth=today.slice(0,7);calendarSelectedDate=today;drawTiles(allLives,today)};
  $('lives').querySelectorAll('[data-cal-date]').forEach(button=>button.onclick=()=>{
    const day=button.dataset.calDate;if(day.slice(0,7)!==calendarMonth)calendarMonth=day.slice(0,7);
    calendarSelectedDate=day;drawTiles(allLives,today);
  });
  bindEventCards();
}

  document.querySelectorAll('[data-copy-ticket-details]').forEach(b=>b.onclick=()=>{const t=data.tickets.find(x=>x.id===b.dataset.copyTicketDetails&&x.memberId===data.me.id);if(t)copyTicketShare(t.liveId,t.number,t.ticketUrl).then(ok=>{if(ok)b.textContent='コピーしました'})});document.querySelectorAll('[data-manage-ticket]').forEach(b=>b.onclick=()=>{if(modalDirty&&!confirm('状況の変更を破棄して個別編集しますか？'))return;ticketForm(data.tickets.find(t=>t.id===b.dataset.manageTicket))});
}
function statusChanges(original){return [...document.querySelectorAll('[data-manage-status]')].filter(el=>!el.disabled).map(el=>{const t=original.find(t=>t.id===el.dataset.manageStatus);return t&&el.value!==t.status?{...t,status:el.value}:null}).filter(Boolean)}
async function submitTicketStatuses(original){
  if(busy)return;
  const changes=statusChanges(original);if(!changes.length)return;
  if(changes.some(t=>{const current=data.tickets.find(x=>x.id===t.id),old=original.find(x=>x.id===t.id);return !current||current.memberId!==data.me.id||ticketPending(current)||current.version!==old.version})){notice('番号の情報が更新されています。入力を控えて、一覧を開き直してください');return}
  const payload=t=>({id:t.id,liveId:t.liveId,number:t.number,status:t.status,recipient:t.recipient||'',memo:t.memo||'',ticketUrl:t.ticketUrl||'',version:t.version});
  if(!data.capabilities?.durableSave||typeof navigator==='undefined'||!navigator.locks){
    busy=true;const controls=[...document.querySelectorAll('#form button,#form select')].filter(el=>!el.disabled);controls.forEach(el=>el.disabled=true);
    try{for(const t of changes){data=applySaveResult(data,await rpc('saveData',memberId,'ticket',payload(t),{response:'patch-v1'}));cacheSnapshot();Object.assign(original.find(x=>x.id===t.id),data.tickets.find(x=>x.id===t.id))}modalDirty=false;busy=false;ticketManager(managerLiveId);notice('保存しました')}
    catch(e){notice('一部の保存を確認できません。'+e.message);$('submit-save').disabled=false}
    finally{busy=false;controls.forEach(el=>el.disabled=false)}return;
  }
  if(outbox.length+changes.length>30){notice('1回の保存は保留中を含め30枚までです。変更を減らして保存してください');return}
  busy=true;const acquired=await acquireQueueLease();busy=false;if(!acquired){notice('別のタブで保存中です。保存が終わってから再度保存してください');return}
  try{if(!outbox.length&&localStorage.getItem(outboxKey())){if(restoreOutbox()){notice('以前の保存を先に確認します。入力は残っています。');processOutbox();return}}}catch(e){releaseQueueLease();notice('端末に保存できません。入力は残っています。');return}
  if(!confirmedData)confirmedData=data;
  const items=changes.map(t=>({id:crypto.randomUUID(),key:operationKey('ticket',t),action:'ticket',payload:payload(t),state:'queued'}));outbox.push(...items);
  try{persistOutbox()}catch(e){outbox.splice(outbox.length-items.length,items.length);if(!outbox.length)releaseQueueLease();notice('端末に保存できません。入力は残っています。');return}
  ++refreshVersion;loading=false;rebuildOptimistic();modalDirty=false;ticketManager(managerLiveId);notice(changes.length+'枚を反映しました。スプシへ保存中…');processOutbox();
}
function closeModal(){if(busy)return;if(modalDirty&&!confirm('入力中の内容を破棄して閉じますか？'))return;modalDirty=false;managerLiveId='';managerMode='';$('modal').close();if(data)render()}
function modal(title,body,onSave){modalDirty=false;const live=/番号|チケット/.test(title)?data?.lives.find(l=>l.id===managerLiveId):null;$('modal').innerHTML=`<div class="modal-head"><h2 id="modal-title" tabindex="-1">${title}</h2>${live?`<p class="modal-context">${esc(live.title)}</p>`:''}</div><form id="form"><div class="modal-body">${body}</div><div id="form-message" class="form-message" role="alert"></div><div class="modal-actions"><button type="button" id="cancel">閉じる</button><button class="primary" id="submit-save">保存</button></div></form>`;$('cancel').textContent=managerLiveId&&managerMode!=='list'?'← 番号一覧':'閉じる';$('cancel').onclick=managerLiveId&&managerMode!=='list'?backToTickets:closeModal;$('modal').oncancel=e=>{e.preventDefault();closeModal()};$('form').oninput=()=>modalDirty=true;$('form').onchange=()=>modalDirty=true;$('form').onsubmit=e=>{e.preventDefault();onSave(Object.fromEntries(new FormData(e.target)))};if(!$('modal').open)$('modal').showModal();$('modal').scrollTop=0;$('modal-title').focus()}

function liveForm(l={}){if(busy)return;managerLiveId='';managerMode='';const available=[...new Set([...(data.groups||[]),...(l.groups||[])])].sort((a,b)=>a.localeCompare(b,'ja'));modal(l.id?'イベントを編集':'イベントを登録',field('日付','date',l.date,'date',true)+field('イベント名','title',l.title,'text',true,'event-title-options')+suggestionList('event-title-options',liveFieldOptions('title'))+field('会場','venue',l.venue,'text',false,'event-venue-options')+suggestionList('event-venue-options',liveFieldOptions('venue'))+field('チケット購入ページURL','purchaseUrl',l.purchaseUrl,'url')+field('抽選締切','lotteryDeadline',l.lotteryDeadline,'date')+`<label for="f-requiredThrows">投げ数</label><input id="f-requiredThrows" name="requiredThrows" type="number" min="0" step="1" value="${esc(l.requiredThrows??'')}" placeholder="未設定"><fieldset><legend>出演グループ（複数選択）</legend><div class="group-options">${available.map(g=>`<label class="group-choice"><input type="checkbox" name="group-option" value="${esc(g)}" ${(l.groups||[]).includes(g)?'checked':''}>${esc(g)}</label>`).join('')||'<span class="muted">グループは下の欄から追加できます。</span>'}</div><label for="new-groups">新しいグループを追加</label><input id="new-groups" name="newGroups" placeholder="例：グループA、グループB"><p class="muted form-hint">カンマ・読点で区切って入力。イベントの保存時に追加されます。</p></fieldset><div class="event-extra-fields">`+field('スプシURL','sheetUrl',l.sheetUrl,'url')+`<label for="memo">メモ</label><textarea id="memo" name="memo" maxlength="500">${esc(l.memo||'')}</textarea></div>`,p=>{const groups=[...document.querySelectorAll('#form input[name="group-option"]:checked')].map(el=>el.value).concat((p.newGroups||'').split(/[,、\n]+/).map(g=>g.trim()).filter(Boolean));rememberEventInput(p.title,p.venue);save('live',{...p,groups,id:l.id,version:l.version})});if(l.id){const remove=document.createElement('button');remove.type='button';remove.className='danger';remove.textContent='イベントをアーカイブ';const actions=document.querySelector('.modal-actions');actions.insertBefore(remove,$('submit-save'));remove.onclick=()=>{if(confirm('次のイベントをアーカイブします。\n\n'+l.title+'\n開催日：'+l.date+'\n締切：'+(l.lotteryDeadline||'未設定')+'\n\n参戦予定・申込状況・チケット情報は保持されます。'))save('archiveLive',{id:l.id,version:l.version,title:l.title})}}}
function parseNumbers(value){return value.normalize('NFKC').trim().split(/[\s,、]+/).filter(Boolean)}
function addForm(){
  if(busy||!managerLiveId)return;
  managerMode='add';const liveId=managerLiveId;
  modal('自分の番号を登録',`<p class="muted">1枚ずつ番号と捌き状況を選び、まとめて登録できます。</p><div id="ticket-entry-rows"></div><div id="duplicate-warning" class="duplicate-warning" role="status"></div><button type="button" id="append-ticket" class="batch-add">＋ 1枚追加</button><details><summary>番号をまとめて貼り付ける</summary><label for="batch-numbers">整理番号</label><textarea id="batch-numbers" placeholder="A12\nA35\nA86"></textarea><p class="muted form-hint">改行・カンマ・空白で区切って入力。追加後に1枚ずつ状況を選べます。</p><button type="button" id="import-numbers">入力欄に追加</button></details><p id="number-preview" class="preview-count" aria-live="polite"></p><p class="muted form-hint">最大50枚。空欄は登録されません。</p>`,()=>{
    const entries=[...$('ticket-entry-rows').children].map(row=>({number:row.querySelector('[data-entry-number]').value.normalize('NFKC').trim(),status:row.querySelector('select').value,ticketUrl:row.querySelector('[data-entry-url]').value.trim()})).filter(e=>e.number);
    if(!entries.length){notice('整理番号を1つ以上入力してください');return}
    const named=entries.map(e=>e.number.toUpperCase()).filter(Boolean);
    if(new Set(named).size!==named.length){notice('同じ整理番号が含まれています。入力を確認してください');return}
    if(!duplicateWarning(liveId,entries.map(e=>e.number))){notice('登録済み番号を確認してください');return}
    save('addTickets',{liveId,entries});
  });
  let serial=0;
  const update=()=>{
    const rows=[...$('ticket-entry-rows').children];
    rows.forEach((row,i)=>{
      const input=row.querySelector('input');
      input.required=false;
      row.querySelector('.entry-label').textContent=(i+1)+'枚目';
      row.querySelector('button').disabled=rows.length===1;
    });
    $('append-ticket').disabled=rows.length>=50;
    rows.forEach(row=>{const number=row.querySelector('[data-entry-number]').value.trim(),url=row.querySelector('[data-entry-url]').value.trim();row.querySelector('[data-copy-entry]').disabled=!(number&&url)});
    const count=rows.filter(row=>row.querySelector('[data-entry-number]').value.trim()).length;
    $('number-preview').textContent=count+'枚を登録・空欄はスキップ';
    $('submit-save').textContent=count+'枚を登録';$('submit-save').disabled=!count;
    duplicateWarning(liveId,rows.map(row=>row.querySelector('input').value));
  };
  const append=(number='')=>{
    const id=++serial;
    $('ticket-entry-rows').insertAdjacentHTML('beforeend',`<div class="ticket-entry"><div class="entry-heading"><strong class="entry-label"></strong><span><button type="button" data-copy-entry="${id}" disabled>情報をコピー</button> <button type="button" class="remove-entry" aria-label="この入力行を削除">削除</button></span></div><div class="entry-fields"><div><label for="entry-number-${id}">整理番号</label><input id="entry-number-${id}" data-entry-number value="${esc(number)}" maxlength="30" placeholder="例：A12" autocapitalize="characters" spellcheck="false"></div><div><label for="entry-status-${id}">捌き状況</label><select id="entry-status-${id}">${opts(statuses,'余り')}</select></div><div class="entry-url"><label for="entry-url-${id}">チケットURL（任意）</label><input id="entry-url-${id}" data-entry-url type="url" maxlength="2000" placeholder="https://"></div></div></div>`);
    update();
  };
  $('ticket-entry-rows').onchange=update;$('ticket-entry-rows').oninput=update;
  $('ticket-entry-rows').onclick=e=>{const copy=e.target.closest('[data-copy-entry]');if(copy){const row=copy.closest('.ticket-entry');copyTicketShare(liveId,row.querySelector('[data-entry-number]').value,row.querySelector('[data-entry-url]').value).then(ok=>{if(ok)copy.textContent='コピーしました'});return}if(e.target.closest('.remove-entry')){e.target.closest('.ticket-entry').remove();modalDirty=true;update()}};
  $('append-ticket').onclick=()=>{if($('ticket-entry-rows').children.length<50){append();modalDirty=true;$('ticket-entry-rows').lastElementChild.querySelector('input').focus()}};
  $('import-numbers').onclick=()=>{
    const numbers=parseNumbers($('batch-numbers').value);
    if(!numbers.length){notice('追加する番号を入力してください');return}
    const rows=[...$('ticket-entry-rows').children];
    const empty=rows.filter(row=>!row.querySelector('input').value.trim()&&row.querySelector('select').value==='余り');
    if(rows.length-empty.length+numbers.length>50){notice('1回に登録できるのは50枚までです');return}
    if(numbers.some(n=>n.length>30)){notice('整理番号は30文字以内にしてください');return}
    empty.forEach(row=>row.remove());
    numbers.forEach(append);$('batch-numbers').value='';modalDirty=true;update();
  };
  for(let i=0;i<3;i++)append();
}

function ticketShareText(liveId,number,url){const live=data.lives.find(l=>l.id===liveId);return ['日付：'+(live?eventDateLabel(live.date):''),'イベント名：'+(live?.title||''),'チケット番号：'+String(number||'').trim(),'URL：'+String(url||'').trim()].join('\n')}
async function copyTicketShare(liveId,number,url){const text=ticketShareText(liveId,number,url);try{await navigator.clipboard.writeText(text);notice('チケット情報をコピーしました');return true}catch(e){modal('チケット情報をコピー',`<p class="muted">下の内容を選択してコピーしてください。</p><textarea id="ticket-share-copy" readonly rows="5">${esc(text)}</textarea>`,()=>{});$('submit-save').hidden=true;$('ticket-share-copy').focus();$('ticket-share-copy').select()}}
function ticketForm(t){if(busy||!t||t.memberId!==data.me.id||ticketPending(t))return;managerMode='edit';modal('チケットを編集',field('整理番号','number',t.number)+`<div id="duplicate-warning" class="duplicate-warning" role="status"></div><label for="status">状態</label><select id="status" name="status" required>${ticketStatusOptions(t.status,true)}</select>`+field('譲り先（任意）','recipient',t.recipient)+`<label for="memo">この番号のメモ</label><textarea id="memo" name="memo" maxlength="500" placeholder="例：〇〇さんに譲渡、受け渡し方法など">${esc(t.memo||'')}</textarea>`+field('本人用チケットURL（任意）','ticketUrl',t.ticketUrl,'url')+`<button type="button" id="copy-ticket-details" class="copy-ticket-details">日付・イベント名・番号・URLをコピー</button><p class="muted form-hint">チケットURL・メモ・譲り先は、ほかのメンバーには表示されません。</p><button class="danger" type="button" id="delete" style="width:100%;margin-top:18px">このチケットを削除</button>`,p=>{if(normalizedNumber(p.number)!==normalizedNumber(t.number)&&!duplicateWarning(t.liveId,[p.number],t.id)){notice('登録済み番号を確認してください');return}save('ticket',{...p,id:t.id,liveId:t.liveId,version:t.version})});const updateCopy=()=>{$('copy-ticket-details').disabled=!($('f-number').value.trim()&&$('f-ticketUrl').value.trim())};$('copy-ticket-details').onclick=async()=>{if(await copyTicketShare(t.liveId,$('f-number').value,$('f-ticketUrl').value))$('copy-ticket-details').textContent='コピーしました'};$('f-number').oninput=()=>{duplicateWarning(t.liveId,normalizedNumber($('f-number').value)===normalizedNumber(t.number)?[]:[$('f-number').value],t.id);updateCopy()};$('f-ticketUrl').oninput=updateCopy;updateCopy();$('delete').onclick=()=>{if(confirm('このチケットを削除しますか？'))save('deleteTicket',{id:t.id,liveId:t.liveId,version:t.version})}}
function showSetup(){ $('account').textContent='';$('app').innerHTML='<div class="card login"><img class="login-mark" src="./icons/favicon.svg?v=4" alt=""><h1>初期設定を準備中です</h1><p>イベント・チケットの保存先を接続すると利用できます。</p><p class="muted">幹事の方は設定手順に沿ってGASを公開し、そのURLを設定してください。メンバーの方の設定は不要です。</p><a href="https://github.com/M0CH4771/ticket-management#最初の設定" target="_blank" rel="noopener">設定手順を見る ↗</a></div>';finishStartup()}
window.addEventListener('popstate',handleHistory);
document.addEventListener('click',e=>{document.querySelectorAll('details.ev-more[open],details.account-menu[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const open=document.querySelector('details.ev-more[open],details.account-menu[open]');if(open){open.open=false;open.querySelector('summary').focus()}});
history.replaceState({ticketView:'home'},'',location.pathname+location.search);
if(!window.LIVE_POCKET_CONFIG?.gasUrl)showSetup();else startApp();
